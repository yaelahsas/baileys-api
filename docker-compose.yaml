version: '3.8'

services:
    baileys:
        build: .
        container_name: baileys-api
        ports:
            - '9999:9999'
        volumes:
            - ./sessions:/app/sessions
        restart: unless-stopped
        env_file:
            - .env
        healthcheck:
            test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:9999/health']
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 60s
        deploy:
            resources:
                limits:
                    memory: 512M
                reservations:
                    memory: 256M
        logging:
            driver: json-file
            options:
                max-size: '10m'
                max-file: '3'
